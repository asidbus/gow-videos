name: Publish
    on:
      schedule:
        - cron: '*/15 * * * *'
      push:
        paths:
          - 'queue.json'
      workflow_dispatch:
    permissions:
      contents: write
    jobs:
      publish:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-python@v5
            with:
              python-version: '3.11'
          - run: pip install requests
          - run: python publish_reels.py
            env:
              ACCOUNTS_JSON: ${{
              secrets.ACCOUNTS_JSON }}
              TELEGRAM_BOT_TOKEN: ${{
              secrets.TELEGRAM_BOT_TOKEN }}
              TELEGRAM_CHAT_ID: ${{
              secrets.TELEGRAM_CHAT_ID }}
