name: Publish Scheduled Reels to Instagram

    on:
      schedule:
        - cron: '*/15 * * * *'
      push:
        paths:
          - 'queue.json'
        branches:
          - main
      workflow_dispatch:
        inputs:
          force_id:
            description: 'Optional Item ID to force
            publish immediately'
            required: false
            default: ''

    permissions:
      contents: write

    jobs:
      publish:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.11'
              cache: 'pip'

          - name: Install Dependencies
            run: |
              python -m pip install --upgrade pip
              pip install requests

          - name: Execute Cloud Reel Publisher
            env:
              ACCOUNTS_JSON: ${{
              secrets.ACCOUNTS_JSON }}
              TELEGRAM_BOT_TOKEN: ${{
              secrets.TELEGRAM_BOT_TOKEN }}
              TELEGRAM_CHAT_ID: ${{
              secrets.TELEGRAM_CHAT_ID }}
              GH_USER: ${{ github.repository_owner }}
            run: |
              FORCE_ARG=""
              if [ -n "${{
              github.event.inputs.force_id }}" ];
              then
                FORCE_ARG="--force-id ${{
                github.event.inputs.force_id }}"
              fi
              python publish_reels.py --queue
              queue.json $FORCE_ARG

          - name: Commit and Push Updated Queue
            run: |
              if [ -n "$(git status --porcelain
              queue.json)" ]; then
                git config user.name
                "github-actions[bot]"
                git config user.email
                "github-actions[bot]@users.noreply.gi
                thub.com"
                git add queue.json
                git commit -m "Automated reel
                publish: update queue.json [skip ci]"
                git pull --rebase origin main
                git push origin main
              else
                echo "No changes in queue.json to
                commit."
              fi
